# /etc/collectd/conf.d/lua.conf
# Copies per-device traffic from nlbwmon into collectd (see nlbw2collectd.lua).
# Requires: collectd-mod-lua, nlbwmon, luci-lib-jsonc
# Loaded through: uci luci_statistics.collectd.Include='/etc/collectd/conf.d'
<LoadPlugin lua>
  Interval 30
</LoadPlugin>

<Plugin lua>
  BasePath "/usr/share/collectd-mod-lua"
  Script "nlbw2collectd.lua"
</Plugin>
